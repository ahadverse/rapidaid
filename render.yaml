services:
  - type: web
    name: rapidaid-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # --include=dev is required: NODE_ENV=production makes npm skip devDependencies,
    # and typescript plus every @types package the build needs lives there.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: SSL_PAYMENT_API
        value: https://sandbox.sslcommerz.com/gwprocess/v4/api.php
      - key: SSL_VALIDATION_API
        value: https://sandbox.sslcommerz.com/validator/api/validationserverAPI.php
      # Set the rest in the Render dashboard so no secret is ever committed.
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SSL_STORE_ID
        sync: false
      - key: SSL_STORE_PASS
        sync: false
      - key: SSL_SUCCESS_URL
        sync: false
      - key: SSL_FAIL_URL
        sync: false
      - key: SSL_CANCEL_URL
        sync: false
      - key: SSL_IPN_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
